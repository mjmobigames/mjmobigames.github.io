<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MJ Games — Mobile games that you want to play</title>
    <style>
        :root {
            --purple-bg: #291570;
            --white-bg: #ffffff;
            --dark-bg: #1c1a17;
            --text-white: #ffffff;
            --text-dark: #000000;
            --text-muted: #757575;
            --yellow-accent: #e1f524;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--white-bg);
            color: var(--text-dark);
            overflow-x: hidden;
        }

        /* --- HERO SECTION --- */
        .hero {
            background-color: var(--purple-bg);
            color: var(--text-white);
            padding: 20px 0 80px;
            position: relative;
        }

        .nav-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-box {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            font-weight: 900;
            line-height: 1;
        }

        .logo-main {
            font-size: 2.2rem;
            color: var(--yellow-accent);
        }

        .logo-sub {
            font-size: 0.75rem;
            letter-spacing: 2px;
            color: var(--text-white);
            margin-top: 2px;
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }

        .nav-links a {
            color: var(--text-white);
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
            opacity: 0.9;
        }

        .nav-links a:hover {
            opacity: 1;
            color: var(--yellow-accent);
        }

        .hero-content {
            max-width: 1100px;
            margin: 60px auto 0;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }

        .hero-text {
            max-width: 550px;
        }

        .hero-text h1 {
            font-size: 3.2rem;
            font-weight: 800;
            line-height: 1.2;
        }

        /* Имитация контура телефона и графики справа */
        .hero-graphics {
            width: 380px;
            height: 400px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .phone-outline {
            width: 200px;
            height: 380px;
            border: 3px solid var(--yellow-accent);
            border-radius: 36px;
            position: relative;
        }

        .phone-outline::before {
            content: '';
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 4px;
            background-color: var(--yellow-accent);
            border-radius: 2px;
        }

        /* --- OUR GAMES SECTION --- */
        .games-section {
            background-color: var(--white-bg);
            padding: 60px 0 100px;
            text-align: center;
        }

        .games-section h2 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 40px;
        }

        .games-grid {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(480px, 1fr));
            gap: 40px;
        }

        .game-card {
            background-color: #0c0a21; /* Темный фон внутри карточек как на макете */
            border-radius: 24px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            text-align: left;
        }

        /* Заглушка под баннер игры (верхняя половина карточки) */
        .game-banner {
            height: 180px;
            background: linear-gradient(135deg, #3b2591, #140d3a);
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.7);
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 2px;
        }

        /* Специфические цвета для создания эффекта макета */
        .card-cryptogram .game-banner { background: linear-gradient(135deg, #51c4d3, #3b2591); }
        .card-4pics-en .game-banner { background: linear-gradient(135deg, #7c1bcf, #140d3a); }
        .card-4pics-es .game-banner { background: linear-gradient(135deg, #4c118a, #0b0721); }
        .card-4pics-ru .game-banner { background: linear-gradient(135deg, #1c52a3, #140d3a); }

        .game-details {
            padding: 20px;
            background-color: #0c0a21;
            color: var(--text-white);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .game-meta {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .game-icon-placeholder {
            width: 48px;
            height: 48px;
            background-color: #291570;
            border-radius: 10px;
        }

        .game-title-block h3 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .game-title-block p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .store-buttons {
            display: flex;
            gap: 8px;
        }

        .store-icon {
            width: 32px;
            height: 32px;
            background-color: #1c1936;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-decoration: none;
            font-size: 0.75rem;
            border: 1px solid #322d5e;
        }

        .store-icon:hover {
            background-color: var(--purple-bg);
        }

        /* --- FOOTER --- */
        footer {
            background-color: var(--dark-bg);
            color: var(--text-white);
            padding: 40px 0 20px;
        }

        .footer-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .footer-center {
            font-size: 1rem;
            color: var(--text-white);
        }

        .footer-links {
            display: flex;
            gap: 20px;
        }

        .footer-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .footer-links a:hover {
            color: var(--text-white);
        }

        .copyright {
            width: 100%;
            text-align: center;
            margin-top: 30px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Адаптивность для мобильных */
        @media (max-width: 900px) {
            .hero-content {
                flex-direction: column;
                text-align: center;
            }
            .hero-text h1 {
                font-size: 2.3rem;
                margin-bottom: 30px;
            }
            .hero-graphics {
                display: none; /* скрываем декоративный телефон на смартфонах */
            }
            .games-grid {
                grid-template-columns: 1fr;
            }
            .game-card {
                max-width: 100%;
            }
            .footer-container {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <!-- ВЕРХНЯЯ ФИОЛЕТОВАЯ СЕКЦИЯ -->
    <section class="hero">
        <div class="nav-container">
            <div class="logo-box">
                <span class="logo-main">MJ</span>
                <span class="logo-sub">GAMES</span>
            </div>
            <nav class="nav-links">
                <a href="#games">Our games</a>
                <a href="#contact">Contact</a>
            </nav>
        </div>

        <div class="hero-content">
            <div class="hero-text">
                <h1>We develop mobile games that you want to play</h1>
            </div>
            <div class="hero-graphics">
                <!-- Декоративный контур смартфона из макета -->
                <div class="phone-outline"></div>
            </div>
        </div>
    </section>

    <!-- СЕКЦИЯ С ИГРАМИ -->
    <section class="games-section" id="games">
        <h2>Our games</h2>
        <div class="games-grid">
            
            <!-- Cryptogram clues -->
            <div class="game-card card-cryptogram">
                <div class="game-banner">CRYPTOGRAM CLUES</div>
                <div class="game-details">
                    <div class="game-meta">
                        <div class="game-icon-placeholder"></div>
                        <div class="game-title-block">
                            <h3>Cryptogram clues</h3>
                            <p>Word Puzzles</p>
                        </div>
                    </div>
                    <div class="store-buttons">
                        <a href="https://google.com" class="store-icon" title="Google Play" target="_blank">▶</a>
