<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="icon" type="image/x-icon" href="favicon.ico">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MJ Games — Mobile games that you want to play</title>
    <style>
        :root {
            --white-bg: #ffffff;
            --dark-bg: #1c1a17;
            --text-white: #ffffff;
            --text-dark: #000000;
            --text-muted: #757575;
            --accent-gold: #F1AF3D;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--white-bg);
            color: var(--text-dark);
            overflow-x: hidden;
        }
        /* --- HERO SECTION --- */
        .hero {
            background: linear-gradient(135deg, #281156, #7816AC);
            color: var(--text-white);
            padding-top: 30px;
            position: relative;
            height: 680px;
            width: 100%;
            display: flex;
            flex-direction: column;
        }
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 40px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 10;
        }
        .logo-img { height: 60px; display: block; object-fit: contain; }
        .nav-links { display: flex; gap: 40px; }
        .nav-links a {
            color: var(--text-white);
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 500;
            opacity: 0.9;
            transition: color 0.2s;
        }
        .nav-links a:hover { opacity: 1; color: var(--accent-gold); }
        .hero-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 40px;
            width: 100%;
            flex-grow: 1;
            display: flex;
            align-items: center;
            position: relative;
            height: calc(100% - 90px);
        }
        .hero-text { max-width: 580px; position: relative; z-index: 5; margin-top: -50px; }
        .hero-text h1 { font-size: 3.8rem; font-weight: 800; line-height: 1.15; letter-spacing: -0.5px; }
        .hero-graphics {
            position: absolute;
            top: 90px; bottom: 0; right: 0;
            height: auto; width: 55%;
            z-index: 1; pointer-events: none;
            display: flex; justify-content: flex-end; align-items: flex-end;
        }
        .hero-phone-img { height: 100%; width: auto; object-fit: contain; object-position: right bottom; }

        /* --- OUR GAMES SECTION --- */
        .games-section {
            background-color: var(--white-bg);
            padding: 80px 0 100px;
            text-align: center;
            position: relative; z-index: 5;
        }
        .games-section h2 { font-size: 2.5rem; font-weight: 800; margin-bottom: 50px; }
        .games-grid {
            max-width: 1200px; margin: 0 auto; padding: 0 40px;
            display: grid; grid-template-columns: repeat(auto-fit, minmax(480px, 1fr)); gap: 40px;
        }
        
        .game-card {
            border-radius: 24px;
            overflow: hidden;
            display: flex; 
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            background-color: transparent;
        }
        
        .game-cover-img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
        }

        /* Изменено: отступы сверху и снизу уменьшены до 12px для компактности */
        .game-details-content {
            padding: 12px 24px;
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            width: 100%;
        }
        
        .cryptogram-card-details {
            background-color: #E6FBE6;
        }
        /* Цвет плашки для второй карточки */
        .fourpics-card-details {
            background-color: #131432;
        }

        /* Белый цвет текста для темных плашек */
        .dark-theme-text h3 {
            color: #ffffff !important;
        }
        .dark-theme-text p {
            color: #a5a1ca !important;
            font-weight: 500;
        }

        .game-meta-block { display: flex; align-items: center; gap: 15px; text-align: left; }
        .game-avatar-img { width: 54px; height: 54px; border-radius: 12px; object-fit: contain; }
        
        .cryptogram-card-details h3 { font-size: 1.25rem; font-weight: 700; color: #000000; margin-bottom: 2px; }
        .cryptogram-card-details p { font-size: 0.85rem; color: #555555; font-weight: 500; }
        
        .old-details { background-color: #0c0a21; }
        .old-text h3 { font-size: 1.1rem; font-weight: 600; color: #ffffff; margin-bottom: 2px; }
        .old-text p { font-size: 0.85rem; color: #a5a1ca; }
        .game-banner-placeholder {
            height: 220px;
            background: linear-gradient(135deg, #1c52a3, #140d3a);
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-weight: bold;
        }

        .store-buttons-row { display: flex; gap: 10px; align-items: center; }
        .store-btn-link { display: block; transition: transform 0.2s; }
        .store-btn-link:hover { transform: scale(1.05); }
        .store-btn-link img { height: 36px; width: auto; display: inline-block; image-rendering: -webkit-optimize-contrast; }
        .store-icon-old {
            width: 36px; height: 36px; background-color: #1c1936; border-radius: 6px;
            display: flex; align-items: center; justify-content: center; color: #fff;
            text-decoration: none; font-size: 0.85rem; border: 1px solid #322d5e;
        }




                /* --- FOOTER (ФИКС АБСОЛЮТНОГО ЦЕНТРИРОВАНИЯ ПОЧТЫ) --- */
        footer {
            background-color: #1c1a17;
            color: #ffffff;
            padding: 40px 0 30px;
        }

        .footer-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative; /* База для центрирования почты */
            flex-wrap: wrap;
        }

        .footer-logo {
            height: 50px;
            display: block;
            object-fit: contain;
        }

        /* Центрирование почты относительно всего футера, а не свободного места */
        .footer-center-wrapper {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            margin-top: -20px; /* Корректировка с учетом высоты строки и копирайта */
        }

        .footer-email-link {
            color: #ffffff;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 400;
            transition: color 0.2s, opacity 0.2s;
            opacity: 0.9;
            white-space: nowrap;
        }

        .footer-email-link:hover {
            opacity: 1;
            color: var(--accent-gold);
        }

        .footer-links {
            display: flex;
            gap: 25px;
        }

        .footer-links a {
            color: #ffffff;
            text-decoration: none;
            font-size: 0.95rem;
            opacity: 0.9;
            transition: color 0.2s, opacity 0.2s;
        }

        .footer-links a:hover {
            opacity: 1;
            color: var(--accent-gold);
        }

        .copyright {
            width: 100%;
            text-align: center;
            margin-top: 40px;
            font-size: 0.9rem;
            color: #ffffff;
            opacity: 0.7;
        }

        /* Адаптивность для мобильных девайсов */
        @media (max-width: 900px) {
            .footer-container {
                flex-direction: column;
                text-align: center;
                gap: 25px;
                padding: 0 20px;
            }
            .footer-center-wrapper {
                position: static;
                transform: none;
                margin-top: 0;
            }
            .footer-links {
                flex-direction: row;
                justify-content: center;
                gap: 20px;
            }
            .copyright {
                margin-top: 20px;
            }
        }




        

        /* --- АДАПТИВНОСТЬ --- */
        @media (max-width: 900px) {
            .hero { height: auto; }
            .nav-container { padding: 0 20px; }
            .hero-content { flex-direction: column; text-align: center; padding: 0 20px; height: auto; }
            .hero-text { margin-top: 40px; max-width: 100%; margin-bottom: 20px; }
            .hero-text h1 { font-size: 2.4rem; }
            .hero-graphics { position: relative; top: 0; right: 0; width: 100%; max-width: 300px; height: auto; margin: 20px auto 0; display: block; }
            .hero-phone-img { width: 100%; height: auto; display: block; vertical-align: bottom; object-position: center bottom; }
            .games-grid { grid-template-columns: 1fr; padding: 0 20px; }
            .game-card { max-width: 100%; }
            .footer-container { flex-direction: column; text-align: center; padding: 0 20px; }
            /* Изменено: на мобильных устройствах уменьшаем padding и убираем лишние зазоры */
            .game-details-content { flex-direction: column; align-items: flex-start; padding: 16px 20px; gap: 15px; }
            .store-buttons-row { width: 100%; justify-content: flex-start; }
        }
    </style>
</head>
<body>

    <section class="hero">
        <div class="nav-container">
            <img src="logo.svg" alt="MJ Games" class="logo-img">
            <nav class="nav-links">
                <a href="#games">Our games</a>
                <a href="#contact">Contact</a>
            </nav>
        </div>
        <div class="hero-content">
            <div class="hero-text">
                <h1>We develop mobile games that you want to play</h1>
            </div>
            <div class="hero-graphics">
                <img src="hero_image.png" alt="Featured Game" class="hero-phone-img">

                        </div>
                    </div>
                    <div class="store-buttons-row">
                        <a href="https://google.com" class="store-btn-link" target="_blank"><img src="googlePlay_icon.svg" alt="Google Play"></a>
                    </div>

            </div>

            <!-- Карточка 4: 4 фото 1 слово -->
            <div class="game-card">
                <img src="4foto1slovo_bg.png" alt="4 фото 1 слово Background" class="game-cover-img">
                <div class="game-details-content fourpics-card-details">
                    <div class="game-meta-block">
                        <img src="4foto1slovo_icon.svg" alt="4 фото 1 слово Logo" class="game-avatar-img">

                            <h3>4 фото 1 слово</h3>
                            <p>игра в слова</p>
                        </div>
                    </div>
                    <div class="store-buttons-row">
                        <a href="https://play.google.com/store/apps/details?id=four.pics.one.word.guess.word.puzzle.game.quiz.pictures.wordbrain.free.ru" class="store-btn-link" target="_blank"><img src="googlePlay_icon.svg" alt="Google Play"></a>
                        <a href="#" class="store-btn-link"><img src="rustore_icon.svg" alt="RuStore"></a>
                    </div>
                </div>
            </div>
        </section>
            <footer id="contact">
        <div class="footer-container">
            <!-- Логотип слева -->
            <img src="logo.svg" alt="MJ Games" class="footer-logo">
            
            <!-- Почта строго по центру страницы -->
            <div class="footer-center-wrapper">
                <a href="mailto:mjmobigames@gmail.com" class="footer-email-link">
                    mjmobigames@gmail.com
                </a>
            </div>
            
            <!-- Ссылки справа -->
            <div class="footer-links">
                <a href="#">Privacy</a>

            </div>
            
            <!-- Копирайт на отдельной строке снизу -->
            <div class="copyright">
                © 2026 MJ Games
            </div>
        </div>
    </footer>
