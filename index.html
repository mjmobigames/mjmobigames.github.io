<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MJ Games — Mobile games that you want to play</title>
    <style>
        :root {
            --white-bg: #ffffff;
            --dark-bg: #1c1a17;
            --text-white: #ffffff;
            --text-dark: #000000;
            --text-muted: #757575;
            --yellow-accent: #e1f524;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--white-bg);
            color: var(--text-dark);
            overflow-x: hidden;
        }

        /* --- HERO SECTION (ИСПРАВЛЕНО ОБРЕЗАНИЕ КАРТИНКИ) --- */
        .hero {
            background: linear-gradient(135deg, #281156, #7816AC);
            color: var(--text-white);
            padding-top: 30px;
            position: relative;
            height: 680px; /* Увеличили высоту, чтобы дать место стрелкам */
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 40px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 10;
        }

        .logo-img {
            height: 60px;
            display: block;
            object-fit: contain;
        }

        .nav-links {
            display: flex;
            gap: 40px;
        }

        .nav-links a {
            color: var(--text-white);
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 500;
            opacity: 0.9;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            opacity: 1;
            color: var(--yellow-accent);
        }

        .hero-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 40px;
            width: 100%;
            flex-grow: 1;
            display: flex;
            align-items: center;
            position: relative;
            height: calc(100% - 90px);
        }

        .hero-text {
            max-width: 580px;
            position: relative;
            z-index: 5;
            margin-top: -50px;
        }

        .hero-text h1 {
            font-size: 3.8rem;
            font-weight: 800;
            line-height: 1.15;
            letter-spacing: -0.5px;
        }

        /* Изменено позиционирование, чтобы картинка не резалась сверху */
        .hero-graphics {
            position: absolute;
            top: 20px; /* Опускаем контейнер чуть ниже меню */
            bottom: 0;
            right: 0;
            height: calc(100% - 20px); /* Занимает всю доступную высоту */
            width: 55%;
            z-index: 1;
            pointer-events: none;
            display: flex;
            justify-content: flex-end;
            align-items: center; /* Центрируем по вертикали, чтобы макет не обрезался */
        }

        .hero-phone-img {
            height: 100%;
            width: auto;
            object-fit: contain;
            object-position: right center;
        }

        /* --- OUR GAMES SECTION --- */
        .games-section {
            background-color: var(--white-bg);
            padding: 80px 0 100px;
            text-align: center;
            position: relative;
            z-index: 5;
        }

        .games-section h2 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 50px;
        }

        .games-grid {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 40px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(480px, 1fr));
            gap: 40px;
        }

        .game-card {
            background-color: #0c0a21;
            border-radius: 24px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            text-align: left;
        }

        .game-banner {
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.7);
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .card-cryptogram .game-banner { background: linear-gradient(135deg, #51c4d3, #3b2591); }
        .card-4pics-en .game-banner { background: linear-gradient(135deg, #7c1bcf, #140d3a); }
        .card-4pics-es .game-banner { background: linear-gradient(135deg, #4c118a, #0b0721); }
        .card-4pics-ru .game-banner { background: linear-gradient(135deg, #1c52a3, #140d3a); }

        .game-details {
            padding: 24px;
            background-color: #0c0a21;
            color: var(--text-white);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .game-meta {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .game-icon-placeholder {
            width: 48px;
            height: 48px;
            background-color: #291570;
            border-radius: 10px;
        }

        .game-title-block h3 {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .game-title-block p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .store-buttons {
            display: flex;
            gap: 8px;
        }

        .store-icon {
            width: 36px;
            height: 36px;
            background-color: #1c1936;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-decoration: none;
            font-size: 0.85rem;
            border: 1px solid #322d5e;
            transition: background-color 0.2s;
        }

        .store-icon:hover {
            background-color: #7816AC;
        }

        /* --- FOOTER --- */
        footer {
            background-color: var(--dark-bg);
            color: var(--text-white);
            padding: 50px 0 20px;
        }

        .footer-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .footer-center {
            font-size: 1rem;
            color: var(--text-white);
            font-weight: 500;
        }

        .footer-links {
            display: flex;
            gap: 25px;
        }

        .footer-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        .footer-links a:hover {
            color: var(--text-white);
        }

        .copyright {
            width: 100%;
            text-align: center;
            margin-top: 40px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* --- АДАПТИВНОСТЬ --- */
        @media (max-width: 900px) {
            .hero {
                height: auto;
                padding-bottom: 40px;
            }
            .nav-container {
                padding: 0 20px;
            }
            .hero-content {
                flex-direction: column;
                text-align: center;
                padding: 0 20px;
                height: auto;
            }
            .hero-text {
                margin-top: 40px;
                max-width: 100%;
            }
            .hero-text h1 {
                font-size: 2.4rem;
            }
            .hero-graphics {
                position: relative;
                top: 0;
                right: 0;
                width: 100%;
                max-width: 300px;
                height: 320px;
                margin: 40px auto 0;
                justify-content: center;
                align-items: center;
            }
            .hero-phone-img {
                object-position: center;
            }
            .games-grid {
                grid-template-columns: 1fr;
                padding: 0 20px;
            }
            .game-card {
                max-width: 100%;
            }
            .footer-container {
                flex-direction: column;
                text-align: center;
                padding: 0 20px;
            }
        }
    </style>
</head>
<body>

    <section class="hero">
        <div class="nav-container">
            <img src="logo.png" alt="MJ Games" class="logo-img">
            <nav class="nav-links">
                <a href="#games">Our games</a>
                <a href="#contact">Contact</a>
            </nav>
        </div>

        <div class="hero-content">
            <div class="hero-text">
                <h1>We develop mobile games that you want to play</h1>
            </div>
            <div class="hero-graphics">
                <img src="hero_image.png" alt="Featured Game" class="hero-phone-img">
            </div>
        </div>
    </section>

    <section class="games-section" id="games">
        <h2>Our games</h2>
        <div class="games-grid">
            
            <div class="game-card card-cryptogram">
                <div class="game-banner">CRYPTOGRAM CLUES</div>
                <div class="game-details">
                    <div class="game-meta">
                        <div class="game-icon-placeholder"></div>
                        <div class="game-title-block">
